query DependabotPrsSearch($searchQuery: String!, $cursor: String) {
  search(query: $searchQuery, type: ISSUE, first: 100, after: $cursor) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      __typename
      ... on PullRequest {
        number
        title
        state
        createdAt
        closedAt
        mergedAt
        url
        baseRefName
        headRefName
        repository {
          name
          owner {
            login
          }
        }
        author {
          __typename
          login
        }
        mergedBy {
          __typename
          login
        }
        autoMergeRequest {
          enabledAt
        }
        reviews(first: 20) {
          nodes {
            author {
              __typename
              login
            }
          }
        }
        comments(first: 20) {
          nodes {
            author {
              __typename
              login
            }
          }
        }
      }
    }
  }
}
