query DependabotPrsBatch($ids: [ID!]!, $cursor: String) {
  nodes(ids: $ids) {
    __typename
    ... on Repository {
      id
      owner {
        login
      }
      name
      pullRequests(
        first: 30
        after: $cursor
        states: [OPEN, MERGED, CLOSED]
        orderBy: { field: UPDATED_AT, direction: DESC }
      ) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          number
          title
          state
          createdAt
          updatedAt
          closedAt
          mergedAt
          url
          baseRefName
          headRefName
          author {
            __typename
            login
          }
          mergedBy {
            __typename
            login
          }
          autoMergeRequest {
            enabledAt
          }
          reviews(first: 20) {
            nodes {
              author {
                __typename
                login
              }
            }
          }
          comments(first: 20) {
            nodes {
              author {
                __typename
                login
              }
            }
          }
        }
      }
    }
  }
}
