name: Release PR

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # release-please runs with an app token (not GITHUB_TOKEN) so the tag it
      # pushes on release triggers the tag-gated release.yml workflow.
      - name: Generate ContextBridge app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CB_PR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.CB_PR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: contextbridge
          repositories: patchwave-analysis
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/bootstrap

      # Runs release-please as a library so it can load scripts/releasePlease/IgnoreDependabot.ts.
      - name: Run release-please
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun run scripts/releasePlease/run.ts
