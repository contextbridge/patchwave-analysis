name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  test:
    name: Tests
    uses: $/.github/workflows/test.yml
    permissions:
      contents: read

  release:
    name: GoReleaser
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create/update the GitHub Release and upload artifacts
      id-token: write # OIDC: assume the AWS release role for signing secrets + sign provenance
      attestations: write # publish Sigstore build-provenance attestations for the artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/bootstrap

      - name: Fetch release secrets
        uses: $/.github/actions/fetch-release-secrets
        with:
          role-to-assume: ${{ secrets.RELEASE_ROLE_ARN }}

      - name: Validate telemetry build config
        shell: bash
        run: |
          set -euo pipefail
          for name in __PW_SENTRY_DSN__ __PW_POSTHOG_KEY__ __PW_POSTHOG_HOST__; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name is required for release builds" >&2
              exit 1
            fi
            echo "::add-mask::$value"
          done

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # Build provenance: a Sigstore-signed attestation binding every release
      # archive (each file listed in checksums.txt) to this repo, commit, and
      # workflow run, recorded in a public transparency log. Verify a download
      # with: gh attestation verify <archive> --repo contextbridge/patchwave-analysis
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist-release/checksums.txt

  # A failed release (e.g. an expired Apple notarization agreement) otherwise stays silent
  # until someone hits the stale installer. Post to #bot-patchwave via the shared prod SNS
  # topic + Chatbot instead. Runs on any failure in the pipeline, including the test gate.
  notify-failure:
    name: Notify Slack on failure
    needs: [test, release]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # OIDC: assume the release role to publish the Slack alert
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.RELEASE_ROLE_ARN }}
          aws-region: us-west-2

      - name: Post failure to #bot-patchwave
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # The topic name is stable (SlackNotificationTarget: cb-notifications-<channel>); derive
          # the account from the assumed role so no account id is hard-coded in the workflow.
          account="$(aws sts get-caller-identity --query Account --output text)"
          topic_arn="arn:aws:sns:us-west-2:${account}:cb-notifications-bot-patchwave"

          message="$(jq -nc \
            --arg tag "$TAG" \
            --arg url "$RUN_URL" \
            '{
              version: "1.0",
              source: "custom",
              content: {
                textType: "client-markdown",
                title: (":rotating_light: patchwave-analysis release \($tag) failed"),
                description: ("The release workflow failed. <\($url)|View the failed run>, fix the cause, then re-run it.")
              }
            }')"

          aws sns publish --region us-west-2 --topic-arn "$topic_arn" --message "$message"
