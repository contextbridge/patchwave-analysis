# Groups minor/patch updates, isolates major versions, and lets security updates through immediately.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/bun'
      # 7.0.x ships without the programmatic API that tooling like typescript-eslint needs. 7.1.x supposedly will.
      - dependency-name: typescript
        versions: ['7.0.x']
    groups:
      bun-minor-patch:
        update-types:
          - minor
          - patch
